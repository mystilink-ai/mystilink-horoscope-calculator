name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve declared version
        id: declared
        run: |
          set -euo pipefail
          declared=""
          if [ -f pyproject.toml ]; then
            declared="$(grep -m1 -E '^version[[:space:]]*=' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          elif [ -f SKILL.md ]; then
            declared="$(grep -m1 -E '^[[:space:]]+version:' SKILL.md | sed -E 's/^[[:space:]]*version:[[:space:]]*//' | tr -d '[:space:]"')"
          fi
          echo "value=$declared" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches declared version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          declared="${{ steps.declared.outputs.value }}"
          if [ -z "$declared" ]; then
            echo "No declared version found; skipping the version check."
            exit 0
          fi
          if [ "$declared" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match declared version ${declared}."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches declared version ${declared}."

      - name: Build release notes from CHANGELOG
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          section="$(mktemp)"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$version" '
              BEGIN { f = 0 }
              /^## / {
                if (f) exit
                if (substr($0, 1, 3 + length(v)) == "## " v) {
                  rest = substr($0, 4 + length(v), 1)
                  if (rest == "" || rest !~ /[0-9A-Za-z]/) { f = 1; next }
                }
              }
              f { print }
            ' CHANGELOG.md > "$section"
          fi
          notes="$(mktemp)"
          {
            if [ -s "$section" ]; then
              cat "$section"
            else
              echo "Release ${GITHUB_REF_NAME}."
            fi
            printf '\nSee `README.md` for install and usage.\n'
          } > "$notes"
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          args=(--title "$version" --notes-file "${{ steps.notes.outputs.path }}")
          case "$version" in
            *a[0-9]*|*b[0-9]*|*rc[0-9]*|*-*)
              args+=(--prerelease)
              ;;
          esac
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; leaving it unchanged."
          else
            gh release create "$tag" "${args[@]}"
          fi
